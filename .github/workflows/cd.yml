name: pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/cd.yml"

  workflow_dispatch:

  workflow_call:
    inputs:
      results_artifact:
        description: "Optional artifact name containing app/results.zon from the bench merge job"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download merged bench results
        if: ${{ inputs.results_artifact != '' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.results_artifact }}
          path: app

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.2131+d08989840
          cache-size-limit: 0
          use-tool-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Site
        run: |
          test -f app/results.zon
          zig build zx -- export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
